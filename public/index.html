<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Mobile responsive viewport setup: prevents unwanted zooming on inputs and handles notched screen safe areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VoyageCloset - AI Wardrobe & Travel Stylist</title>

    <style id="expo-reset">
      /* Full-height viewport resets for mobile browsers (Safari / Chrome) */
      html,
      body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        overflow: hidden;
      }

      /* Prevent mobile browsers from auto-zooming inputs on tap */
      input, textarea, select {
        font-size: 16px !important;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
